<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LGS Karargahı</title>
    <meta http-equiv="refresh" content="0; url=https://lgs-karargahi.streamlit.app/">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="LGS Karargahı">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <script>
        // Cross-origin iframe içinde üçüncü taraf çerez (SameSite=Lax) engeli yüzünden
        // PDF ve dosya yüklemenin hata vermemesi için doğrudan ana uygulamaya yönlendir:
        window.location.replace("https://lgs-karargahi.streamlit.app/");
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            max-width: 400px;
            width: 100%;
            padding: 28px 24px;
            text-align: center;
            box-shadow: 0 18px 40px rgba(99, 102, 241, 0.12);
            border: 1.5px solid #c7d2fe;
        }
        .icon {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            margin: 0 auto 14px auto;
        }
        .title { font-size: 20px; font-weight: 800; color: #312e81; margin-bottom: 8px; }
        .desc { font-size: 14px; color: #475569; font-weight: 600; margin-bottom: 20px; line-height: 1.5; }
        .btn {
            display: inline-block;
            width: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            text-decoration: none;
            border-radius: 14px;
            padding: 14px 18px;
            font-size: 15px;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="icon-192.png" class="icon" alt="LGS Karargahı">
        <div class="title">🎯 LGS Karargahı Açılıyor...</div>
        <div class="desc">PDF ve görsel yükleme özelliklerinin tam kapasite çalışması için doğrudan karargaha yönlendiriliyorsun.</div>
        <a class="btn" href="https://lgs-karargahi.streamlit.app/">🚀 Hemen Karargaha Git</a>
    </div>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
